name: Build GIGI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-windows:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Instalar Playwright
        run: |
          playwright install chromium

      - name: Build Windows
        run: |
          pyinstaller --onefile --windowed --clean --collect-all playwright --icon=gui/assets/icon.ico --add-data "gui/assets;gui/assets" --add-data "gui/assets/MsgGerente.xlsx;gui/assets"  --name GIGI main.py

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: GIGI-Windows
          path: dist/GIGI.exe


  build-macos:

    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Instalar Playwright
        run: |
          playwright install chromium

      - name: Build macOS
        run: |
          pyinstaller \
            --windowed \
            --clean \
            --collect-all playwright \
            --add-data "gui/assets:model/assets" \
          --add-data "gui/assets/MsgGerente.xlsx:gui/assets" \
            --name GIGI \
            main.py

      - name: Compactar App
        run: |
          cd dist
          zip -r GIGI-macOS.zip GIGI.app

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: GIGI-macOS
          path: dist/GIGI-macOS.zip


  build-linux:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Instalar Playwright
        run: |
          playwright install chromium

      - name: Build Linux
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --collect-all playwright \
            --name GIGI \
            main.py

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: GIGI-Linux
          path: dist/GIGI


  release:

    needs:
      - build-windows
      - build-macos
      - build-linux

    runs-on: ubuntu-latest

    steps:

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GIGI-Windows/**
            GIGI-macOS/**
            GIGI-Linux/**